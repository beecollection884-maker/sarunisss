name: sarunis

services:
  app:
    image: sarunis-app:latest
    container_name: sarunis_app
    restart: unless-stopped
    ports:
      - "8090:8000"
    env_file: docker-compose.env
    environment:
      APP_NAME: "SMP IP YAKIN"
      APP_ENV: local
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8090}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sarunis
      DB_USERNAME: root
      DB_PASSWORD: "${DB_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]

  db:
    image: mysql:8.0
    container_name: sarunis_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    env_file: docker-compose.env
    environment:
      MYSQL_DATABASE: sarunis
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql
      - ./railway_dump.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data: