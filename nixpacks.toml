[variables]
NIXPACKS_PHP_VERSION = '8.3'

[phases.setup]
nixPkgs = ['php83', 'php83Packages.composer', 'nodejs_20']

[phases.build]
cmds = [
  'composer install --no-dev --optimize-autoloader --no-interaction',
  'npm ci || npm install',
  'npm run build'
]

[start]
cmd = 'php artisan storage:link --force && php artisan serve --host=0.0.0.0 --port=$PORT'
